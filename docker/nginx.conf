# NGINX ingress for vips-is (docker-compose)
#
# Consistent-hash routing: the IIIF identifier is extracted from the request
# URI and used as the hash key so all tile requests for the same image are
# forwarded to the same ImageServer replica.
#
# The map directive captures the first path segment after /iiif/vN/image/
# (e.g. /iiif/v3/image/archive%2Fimage001.tif/full/max/0/default.jpg → archive%2Fimage001.tif).
# When the URI does not match the pattern the full URI is used as the key,
# which gives uniform distribution for non-IIIF paths.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Extract the IIIF identifier from the request URI.
    # $1 is the first capture group of the matching regex.
    map $request_uri $iiif_id {
        ~^/iiif/v[23]/image/([^/?]+) $1;
        default                        $request_uri;
    }

    upstream imageservers {
        # Consistent hash by IIIF identifier — same image always hits the
        # same ImageServer pod, keeping its gRPC round-trip count low.
        hash $iiif_id consistent;

        server imageserver-1:8080;
        server imageserver-2:8080;
        server imageserver-3:8080;
    }

    server {
        listen 80;
        server_name _;

        # Pass real client address to the application.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # IIIF image requests → consistently routed to one ImageServer.
        location /iiif {
            proxy_pass         http://imageservers;
            proxy_read_timeout 120s;
            proxy_send_timeout 30s;
        }

        # Catch-all for other paths (e.g. health checks from an external probe).
        location / {
            return 404;
        }
    }
}
