## gRPC server
quarkus.grpc.server.port=9000

## Management (metrics, health) — offset from gRPC to avoid conflict
quarkus.management.port=9001
quarkus.grpc.server.ssl.certificate=/certs/tls.crt
quarkus.grpc.server.ssl.key=/certs/tls.key
quarkus.grpc.server.ssl.client-auth=REQUIRED
quarkus.grpc.server.ssl.trust-certificate=/certs/ca.crt

## Cache settings
cache.ttl-hours=24
cache.max-images=10
cache.estimated-image-bytes=524288000
cache.memory-overhead-bytes=536870912
cache.size-multiplier=20
cache.chunk-size-bytes=1048576

## Storage backend (filesystem | s3)
storage.type=filesystem
storage.directory=/data/images

## S3 (only used when storage.type=s3)
#storage.s3.endpoint=https://s3.example.com
#storage.s3.region=us-east-1
#storage.s3.default-bucket=images

## Metrics
quarkus.management.enabled=true
quarkus.micrometer.export.json.enabled=true
quarkus.micrometer.export.json.path=metrics/json
quarkus.micrometer.export.prometheus.path=metrics/prometheus

## Logging
quarkus.log.category."cc.vips_is".level=DEBUG

## Dev profile: disable mTLS, use filesystem
%dev.quarkus.grpc.server.ssl.certificate=
%dev.quarkus.grpc.server.ssl.key=
%dev.quarkus.grpc.server.ssl.client-auth=NONE
%dev.quarkus.grpc.server.ssl.trust-certificate=
%dev.storage.directory=src/test/resources/images
